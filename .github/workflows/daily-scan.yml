name: Daily Nigeria incident scan

on:
  schedule:
    # Each slot scans new reports. Concurrency serializes runs; ingestion deduplicates events.
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
    # Weekly catch-up covers late reporting over fourteen days.
    - cron: "30 19 * * 0"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Incident-date lookback window
        type: choice
        required: true
        default: "168"
        options:
          - "48"
          - "72"
          - "96"
          - "120"
          - "168"
          - "336"

concurrency:
  group: daily-nigeria-incident-scan
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_CLEANUP_ENABLED: "true"
      DEEPSEEK_DUPLICATE_CHECK_ENABLED: "true"
      DEEPSEEK_DUPLICATE_MAX_PAIRS: "30"
      DEEPSEEK_MODEL: deepseek-chat
      NEWS_DISCOVERY_ENABLE_BING: "false"
      INCIDENT_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || (github.event.schedule == '30 19 * * 0' && '336') || '168' }}
      SEARCH_PUBLICATION_MAX_AGE_HOURS: ${{ (github.event.inputs.lookback_hours == '336' || github.event.schedule == '30 19 * * 0') && '336' || '168' }}
      SEARCH_FRESHNESS: ${{ (github.event.inputs.lookback_hours == '336' || github.event.schedule == '30 19 * * 0') && 'month' || 'week' }}
      SCAN_SOURCE: ${{ github.event_name }}
      INCIDENT_REVIEW_RETRY_LIMIT: "5"
      INCIDENT_REVIEW_MAX_ATTEMPTS: "3"
      SEARCH_LED_FEEDS_ENABLED: "true"
      STATE_SCAN_CONCURRENCY: "3"
      BRAVE_SEARCH_MAX_CALLS_PER_RUN: "40"
      BRAVE_SEARCH_MIN_DELAY_MS: "5000"
      SEARCH_RESULTS_PER_QUERY: "10"
      SOURCE_FETCH_TIMEOUT_MS: "10000"
      SCAN_MAX_FETCH_FAILURES: "3"
      SCAN_FETCH_FAILURE_TOLERANCE_RATIO: "0.1"
      SCAN_REPORT_PATH: ${{ github.workspace }}/incident-scan-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run search-led discovery + ingest + duplicate check
        run: npx -y tsx scripts/search-led-scan.ts
      - name: Upload scan report and review leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-scan-report-${{ github.run_id }}
          path: ${{ github.workspace }}/incident-scan-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Explain scan failure
        if: failure()
        run: |
          echo "::error::Incident collection needs attention. Inspect scan health in the app and this run's report."
          echo "### Collection needs attention" >> "$GITHUB_STEP_SUMMARY"
          echo "This scan failed. The dashboard retains the last verified coverage and flags overdue scans." >> "$GITHUB_STEP_SUMMARY"
