name: Daily Nigeria incident scan

on:
  schedule:
    # Primary run plus a guarded daily retry in case GitHub misses the first schedule event.
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Incident-date lookback window
        type: choice
        required: true
        default: "96"
        options:
          - "48"
          - "72"
          - "96"
          - "120"
          - "168"

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_CLEANUP_ENABLED: "true"
      DEEPSEEK_MODEL: deepseek-chat
      NEWS_DISCOVERY_ENABLE_BING: "false"
      INCIDENT_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '96' }}
      SEARCH_PUBLICATION_MAX_AGE_HOURS: "168"
      STATE_SCAN_CONCURRENCY: "3"
      BRAVE_SEARCH_MAX_CALLS_PER_RUN: "40"
      SEARCH_RESULTS_PER_QUERY: "10"
      SOURCE_FETCH_TIMEOUT_MS: "10000"
      SCAN_REPORT_PATH: ${{ github.workspace }}/incident-scan-report.json
    steps:
      - name: Skip backup if today's scan already succeeded
        id: backup_guard
        if: github.event_name == 'schedule' && github.event.schedule == '30 9 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today="$(TZ=Africa/Lagos date +%F)"
          runs="$(gh run list --workflow daily-scan.yml --limit 100 --json databaseId,createdAt,conclusion,status --jq '.[] | [.databaseId, .createdAt, (.conclusion // ""), .status] | @tsv')"
          while IFS=$'\t' read -r run_id created_at conclusion status; do
            [ -n "$run_id" ] || continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            run_day="$(TZ=Africa/Lagos date -d "$created_at" +%F)"
            if [ "$run_day" = "$today" ] && { [ "$conclusion" = "success" ] || [ "$status" = "in_progress" ]; }; then
              echo "Today's scan is already successful or running (run $run_id); skipping backup."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.backup_guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.backup_guard.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: steps.backup_guard.outputs.skip != 'true'
        run: npm ci
      - name: Run search-led discovery + ingest + duplicate check
        if: steps.backup_guard.outputs.skip != 'true'
        run: npx -y tsx scripts/search-led-scan.ts
      - name: Upload scan report and review leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-scan-report-${{ github.run_id }}
          path: ${{ github.workspace }}/incident-scan-report.json
          if-no-files-found: ignore
          retention-days: 30
