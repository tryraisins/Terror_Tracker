name: Daily 48h incident scan

on:
  schedule:
    # Free GitHub Actions cron fallback. Runs 30 minutes after the Netlify
    # scheduled function (06:00 UTC) so it only matters when Netlify failed.
    # Cron is UTC.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      NEWS_DISCOVERY_ENABLE_BING: "false"
      STATE_SCAN_CONCURRENCY: "3"
      BRAVE_SEARCH_MAX_CALLS_PER_RUN: "20"
      SEARCH_RESULTS_PER_QUERY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run search-led discovery + ingest + duplicate check
        run: npx -y tsx scripts/search-led-scan.ts
