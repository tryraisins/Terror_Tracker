name: Publish image

# Builds both container targets and pushes them to GHCR, then optionally deploys.
# Deploy is gated on the repository variable DEPLOY_ENABLED so the pipeline can
# land before the server is ready.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "audit-2026/**"
      - "security-audit/**"
      - "design/**"
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tryraisins/terror-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Turnstile site key is inlined into the client bundle at build time,
      # so a missing value produces an image whose admin login can never render
      # the challenge. Fail loudly instead of shipping it.
      - name: Require build-time public values
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_TURNSTILE_SITE_KEY is not set."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max

      - name: Build and push scan image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: scan
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}-scan
            ${{ env.IMAGE }}:latest-scan
          cache-from: type=gha,scope=scan
          cache-to: type=gha,scope=scan,mode=max

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The deploy key is pinned to a forced command that accepts nothing but
          # a 40-character commit sha, so this is the entire remote instruction.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "ops@${DEPLOY_HOST}" "${GITHUB_SHA}"
