[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,DEFAULT_ADMIN_USERNAME,GEMINI_MODEL,GEMINI_DEDUP_MODEL,FREE_SOURCE_MAX_ARTICLE_AGE_HOURS,FREE_SOURCE_MAX_INCIDENT_AGE_DAYS,FREE_SOURCE_MAX_ITEMS_PER_FEED,FREE_SOURCE_CONCURRENCY,STATE_SCAN_CONCURRENCY,GAP_SCAN_CONCURRENCY,SOURCE_FETCH_TIMEOUT_MS"

[functions]
  node_bundler = "esbuild"

# Daily security-incident discovery: scans all states via verified RSS feeds
# and ingests qualifying incidents from the trailing 48-hour window.
# Cron is evaluated in UTC (06:00 UTC == 07:00 WAT).
[functions."scheduled-update-background"]
  schedule = "0 6 * * *"

# Daily search-led discovery (free engines + Brave fallback, no Gemini) over the
# trailing 48-hour window, plus the report-only duplicate check on the same run.
[functions."scheduled-discovery-background"]
  schedule = "0 6 * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"
