[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,DEFAULT_ADMIN_USERNAME,FREE_SOURCE_MAX_ARTICLE_AGE_HOURS,FREE_SOURCE_MAX_INCIDENT_AGE_DAYS,FREE_SOURCE_MAX_ITEMS_PER_FEED,SOURCE_FETCH_TIMEOUT_MS"

[functions]
  node_bundler = "esbuild"

[functions."scheduled-update-background"]
  schedule = "0 * * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"
